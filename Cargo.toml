[workspace]
members = ["crates/aurapilot-core", "crates/aurapilot-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
dirs = "6.0.0"
flate2 = "1.1.5"
getrandom = "0.4.3"
notify = "8.2.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "serde_norway", version = "0.9.42" }
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.19"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
zeroize = "1.9.0"

# Keep local and CI build artifacts bounded. AuraPilot favors predictable disk
# usage over incremental Rust rebuild speed.
[profile.dev]
incremental = false

[profile.test]
incremental = false

[profile.release]
incremental = false

[profile.bench]
incremental = false
